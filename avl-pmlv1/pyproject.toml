[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avl-pmlv1"
version = "1.0.0"
description = "AVL-PMLv1: Pure-Forward Dual-Track Symbolic Block-Diffusion with Tri-State Self-Tuning MoE & Static Engram"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
