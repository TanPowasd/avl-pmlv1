optimizer: "adamw"
betas: [0.9, 0.95]
eps: 1.0e-8
max_grad_norm: 1.0
aux_backbone_grad_ratio_cap: 0.15
warmup_ratio: 0.05

loss_weights:
  diff: 1.00
  align: 0.25
  util: 0.15
  budget: 0.10
  graph: 0.05
  repair: 0.30

groups:
  group_a_backbone:
    lr_stage_b: 3.0e-5
    lr_stage_c: 2.0e-5
    lr_stage_d: 5.0e-6
    lora_lr_multiplier: 5.0
    weight_decay: 0.01
    fp32_master: false
  group_b_routed_experts:
    lr_stage_b: 5.0e-5
    lr_stage_c: 8.0e-5
    lr_stage_d: 8.0e-6
    weight_decay: 0.01
    fp32_master: false
  group_c_new_modules:
    lr_stage_b: 5.0e-4
    lr_stage_c: 3.0e-4
    lr_stage_d: 1.5e-5
    weight_decay: 0.01
    fp32_master: true
  group_d_manifold_scalars:
    lr_stage_b: 1.5e-4
    lr_stage_c: 1.0e-4
    lr_stage_d: 5.0e-6
    weight_decay: 0.0
    fp32_master: true
  group_e_static_engram_table:
    lr_stage_b: 2.5e-3
    lr_stage_c: 1.5e-3
    lr_stage_d: 5.0e-5
    weight_decay: 0.0
    fp32_master: true
